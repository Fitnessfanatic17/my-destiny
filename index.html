<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZERO FRICTION</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="FLOW">
    <meta name="apple-mobile-web-app-title" content="FLOW">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;500;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(25, 25, 35, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --color-glow: #FFFFFF;
            --text-main: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #launch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .launch-modal {
            width: 90%;
            max-width: 550px;
            padding: 50px 40px;
            text-align: center;
        }

        .launch-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 24px;
        }

        .launch-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            line-height: 1.8;
            margin-bottom: 48px;
        }

        .got-it-btn {
            background: #FFFFFF;
            color: #000000;
            border: none;
            padding: 16px 48px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .got-it-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        }

        #timer-screen {
            width: 90%;
            max-width: 550px;
            padding: 60px 30px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease, transform 1s ease;
        }

        #timer-screen.active {
            opacity: 1;
            transform: scale(1);
        }

        #phase-text {
            font-size: clamp(36px, 12vw, 80px);
            font-weight: 900;
            letter-spacing: 12px;
            margin-bottom: 20px;
            color: var(--color-glow);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: color 0.5s, text-shadow 0.5s;
        }

        #time-text {
            font-size: clamp(70px, 20vw, 150px);
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            width: 70%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background-color: var(--color-glow);
            box-shadow: 0 0 15px var(--color-glow);
            transition: width 0.3s linear;
        }

        /* --- ANDROID & MOBILE LANDSCAPE OPTIMIZATION --- */
        @media (orientation: landscape) and (max-height: 550px) {
            .launch-modal {
                width: 85%;
                max-width: 480px;
                padding: 24px 30px;
                border-radius: 24px;
            }

            .launch-title {
                font-size: clamp(18px, 6vh, 24px);
                margin-bottom: 10px;
            }

            .launch-subtitle {
                font-size: clamp(11px, 3.8vh, 13px);
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .got-it-btn {
                padding: 12px 38px;
                font-size: 14px;
            }

            #timer-screen {
                width: 85%;
                max-width: 480px;
                padding: 24px 30px;
                border-radius: 24px;
            }

            #phase-text {
                font-size: clamp(26px, 11vh, 52px);
                letter-spacing: 10px;
                margin-bottom: 8px;
            }

            #time-text {
                font-size: clamp(54px, 26vh, 105px);
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <audio id="notify-sound" src="Temple bell.mp3" preload="auto"></audio>

    <div id="timer-screen" class="glass-panel">
        <div id="phase-text">WORK</div>
        <div id="time-text">25:00</div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div id="launch-overlay">
        <div class="glass-panel launch-modal">
            <div class="launch-title">FIND THE FLOW.</div>
            <div class="launch-subtitle">FOCUS FOR 25 MINUTES.<br>RECHARGE FOR 5 MINUTES.</div>
            <button class="got-it-btn" id="got-it-btn">GOT IT</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ZERO-LATENCY AUDIO & KEEP-ALIVE ENGINE
        // ==========================================
        const fallbackAudio = document.getElementById('notify-sound');
        let audioCtx = null;
        let bellBuffer = null;

        async function initAudioEngine() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) {
                    audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // Pre-decode MP3 into RAM for instant 0ms playback
                if (!bellBuffer) {
                    const response = await fetch('Temple bell.mp3');
                    const arrayBuffer = await response.arrayBuffer();
                    bellBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                }

                // Sub-audible keep-alive oscillator prevents Windows & Android from putting audio hardware to sleep
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.value = 0.00001;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
            } catch (err) {
                console.warn('Web Audio API fallback to HTML5 Audio:', err);
            }

            // Unlock fallback HTML5 audio element
            fallbackAudio.volume = 0.01;
            fallbackAudio.play().then(() => {
                fallbackAudio.pause();
                fallbackAudio.currentTime = 0;
                fallbackAudio.volume = 1.0;
            }).catch(() => {});
        }

        function playBellSoundImmediately() {
            if (audioCtx && bellBuffer) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const source = audioCtx.createBufferSource();
                source.buffer = bellBuffer;
                source.connect(audioCtx.destination);
                source.start(0);
            } else {
                fallbackAudio.currentTime = 0;
                fallbackAudio.play().catch(err => console.warn('Audio playback prevented:', err));
            }
        }

        // Keep device awake on Android & Windows when possible
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        });

        // ==========================================
        // UNTHROTTLED BACKGROUND WEB WORKER TIMER
        // ==========================================
        let timerWorker = null;

        function startUnthrottledClock() {
            updateTimer();
            const workerScript = `
                setInterval(() => {
                    postMessage('tick');
                }, 250);
            `;
            const blob = new Blob([workerScript], { type: 'application/javascript' });
            timerWorker = new Worker(URL.createObjectURL(blob));
            timerWorker.onmessage = () => updateTimer();
        }

        // ==========================================
        // LAUNCH LOGIC & PERMISSIONS
        // ==========================================
        const launchOverlay = document.getElementById('launch-overlay');
        const timerScreen = document.getElementById('timer-screen');
        const gotItBtn = document.getElementById('got-it-btn');

        gotItBtn.addEventListener('click', async () => {
            launchOverlay.style.opacity = '0';
            launchOverlay.style.visibility = 'hidden';
            timerScreen.classList.add('active');

            await initAudioEngine();
            requestWakeLock();

            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }

            startUnthrottledClock();
        });

        // ==========================================
        // TIME SYNC & NOTIFICATION ENGINE
        // ==========================================
        let currentPhaseIsWork = null;

        function updateTimer() {
            const now = new Date();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // 0-24 & 30-54 = WORK | 25-29 & 55-59 = BREAK
            const isWorkPhase = (m < 25) || (m >= 30 && m < 55);

            if (currentPhaseIsWork !== null && currentPhaseIsWork !== isWorkPhase) {
                triggerNotification(isWorkPhase);
            }
            currentPhaseIsWork = isWorkPhase;

            let targetMinute = 60;
            if (m < 25) targetMinute = 25;
            else if (m < 30) targetMinute = 30;
            else if (m < 55) targetMinute = 55;

            let remMin = targetMinute - 1 - m;
            let remSec = 60 - s;
            if (remSec === 60) {
                remMin += 1;
                remSec = 0;
            }

            document.getElementById('phase-text').innerText = isWorkPhase ? 'WORK' : 'BREAK';
            document.getElementById('time-text').innerText =
                String(remMin).padStart(2, '0') + ':' + String(remSec).padStart(2, '0');

            const totalPhaseSeconds = isWorkPhase ? 1500 : 300;
            const remainingTotalSeconds = (remMin * 60) + remSec;
            const elapsedSeconds = totalPhaseSeconds - remainingTotalSeconds;
            const progressPct = (elapsedSeconds / totalPhaseSeconds) * 100;

            document.getElementById('progress-fill').style.width = progressPct + '%';
        }

        function triggerNotification(isWorkPhase) {
            // 1. Play zero-latency bell sound immediately
            playBellSoundImmediately();

            // 2. Vibrate mobile hardware directly if supported
            if ('vibrate' in navigator) {
                navigator.vibrate([300, 100, 300, 100, 400]);
            }

            // 3. Fire system notification with sound & vibration
            if ('Notification' in window && Notification.permission === 'granted') {
                const title = 'FLOW';
                const body = isWorkPhase ? 'Break done! Focus time.' : 'Work done! Time to recharge.';

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.ready.then(registration => {
                        if (registration.active) {
                            registration.active.postMessage({
                                type: 'PHASE_NOTIFICATION',
                                body: body
                            });
                        } else {
                            registration.showNotification(title, {
                                body: body,
                                icon: './icon-192.png',
                                badge: './icon-192.png',
                                tag: 'flow-phase-alert',
                                renotify: true,
                                silent: false,
                                requireInteraction: true,
                                vibrate: [300, 100, 300, 100, 400]
                            });
                        }
                    }).catch(() => {
                        new Notification(title, { body: body, icon: './icon-192.png', silent: false });
                    });
                } else {
                    new Notification(title, { body: body, icon: './icon-192.png', silent: false });
                }
            }
        }

        // ==========================================
        // 3D STARFIELD ENGINE
        // ==========================================
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const stars = [];
        const STAR_COUNT = 400;
        let mouseX = 0, mouseY = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('mousemove', e => {
            mouseX = (e.clientX - width / 2) * 0.05;
            mouseY = (e.clientY - height / 2) * 0.05;
        });

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * width;
                this.size = Math.random() * 1.5;
                this.color = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.5})`;
            }
            update() {
                this.z -= 1.5;
                if (this.z <= 0) {
                    this.z = width;
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }
            }
            draw() {
                const scale = width / this.z;
                const sx = (this.x - width / 2) * scale + width / 2 + mouseX * scale;
                const sy = (this.y - height / 2) * scale + height / 2 + mouseY * scale;
                const r = this.size * scale;

                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        function animateSpace() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);
            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // ==========================================
        // PWA SERVICE WORKER REGISTRATION
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
